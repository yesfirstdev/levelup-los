# Manual deployment only: validate the hosted database and Auth settings first.
# Run this workflow from levelup after merging this config from main.
# Set the repository variable (or secret) LEVELUP_SUPABASE_ANON_KEY to the
# project's public anon/publishable key. Never use a service-role/secret key.
# This fork deploys only its own Pages site; it never deploys upstream brands.
name: Deploy app to Pages

on:
  workflow_dispatch:
    inputs:
      database_validated:
        description: "Hosted database migrations, RLS and Auth redirects have been validated"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'yesfirstdev/levelup-los' && github.ref == 'refs/heads/levelup' && inputs.database_validated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_PATH: /levelup-los/
      VITE_DATA_SOURCE: supabase
      VITE_SUPABASE_URL: https://hzgnomktnfhsdlodamtp.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ vars.LEVELUP_SUPABASE_ANON_KEY || secrets.LEVELUP_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate public backend configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.VITE_SUPABASE_ANON_KEY?.trim();
          const ref = new URL(process.env.VITE_SUPABASE_URL).hostname.split('.')[0];
          const fail = () => {
            console.error('Set LEVELUP_SUPABASE_ANON_KEY to this project’s public anon/publishable key.');
            process.exit(1);
          };
          if (!key) fail();
          if (key.startsWith('sb_publishable_')) {
            if (key.length <= 'sb_publishable_'.length) fail();
          } else {
            try {
              const parts = key.split('.');
              if (parts.length !== 3) fail();
              const payload = JSON.parse(Buffer.from(parts[1], 'base64url').toString());
              if (payload.role !== 'anon' || payload.ref !== ref) fail();
            } catch { fail(); }
          }
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        # Unit fixtures must never use the hosted database.
        env:
          VITE_DATA_SOURCE: local
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
      - run: npm run build
      # Pages has no SPA rewrite support. Preserve the existing fallback for
      # direct links, including /levelup-los/auth/callback, and disable Jekyll.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
